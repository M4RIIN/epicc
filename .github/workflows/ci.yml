name: Vérifications
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: epicc
          POSTGRES_PASSWORD: testtest
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://epicc:testtest@127.0.0.1:5432
      TEST_DB_PREFIX: test_ci_
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: traces-navigateur
          path: test-results/
  deploy-development:
    name: Déployer sur Railway development
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: development
      url: https://epicc-development.up.railway.app
    concurrency:
      group: railway-development
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Installer la CLI Railway
        run: npm install --global @railway/cli@5.71.0
      - name: Déployer le service EPICC
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo '::error::Ajouter le secret GitHub Actions RAILWAY_TOKEN avec un jeton du projet Railway limité à development.'
            exit 1
          fi
          railway up --ci --project ed8fc074-7306-4773-b03c-fd468da68e68 \
            --environment development \
            --service 18ea4b9e-e7eb-41c5-b15e-d83f26cc15f6
