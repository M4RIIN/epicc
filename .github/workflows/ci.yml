name: Vérifications
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: traces-navigateur
          path: test-results/
  build-pages:
    name: Préparer la vitrine pour GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - name: Générer la vitrine
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
  deploy-pages:
    name: Publier la vitrine sur GitHub Pages
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  deploy-development:
    name: Déployer sur Railway development
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: development
      url: https://epicc-development.up.railway.app
    concurrency:
      group: railway-development
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Installer la CLI Railway
        run: npm install --global @railway/cli@5.71.0
      - name: Déployer le service EPICC
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo '::error::Ajouter le secret GitHub Actions RAILWAY_TOKEN avec un jeton du projet Railway limité à development.'
            exit 1
          fi
          railway up --ci --project ed8fc074-7306-4773-b03c-fd468da68e68 \
            --environment development \
            --service 18ea4b9e-e7eb-41c5-b15e-d83f26cc15f6
